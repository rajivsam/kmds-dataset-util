[project]
name = "kmds-dataset-util"
version = "0.1.0"
description = "KMDS dataset utility package for dataset preparation workflows"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "kaggle>=1.6.0",
  "pandas>=3.0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ipykernel>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
